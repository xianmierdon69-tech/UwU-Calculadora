<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UwU Cafe - POS Sakura Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --uwu-pink: #ff85a1;
            --text-color: #4a3a52;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.5);
        }

        /* Fondo desenfocado */
        .bg-wrapper {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://r2.fivemanage.com/m10wOfsBbd2jLEbtALCU6/uwu.jpg') no-repeat center center;
            background-size: cover;
            filter: blur(10px);
            transform: scale(1.1);
            z-index: -2;
        }

        /* Capa para la lluvia de Sakura */
        #sakura-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; /* Para que no bloquee los clics */
            z-index: -1;
            overflow: hidden;
        }

        .sakura {
            position: absolute;
            top: -10%;
            user-select: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }

        body {
            font-family: 'Quicksand', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
            overflow: hidden;
        }

        /* Pantalla de inicio */
        #welcome-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 235, 243, 0.98);
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.6s ease;
        }

        .enter-btn {
            padding: 15px 45px;
            font-size: 1.8rem;
            background: var(--uwu-pink);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(255, 133, 161, 0.4);
            transition: 0.3s ease;
        }

        /* Contenedor Principal */
        .container {
            width: 95%;
            max-width: 1100px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            display: grid;
            grid-template-columns: 1fr 380px;
            height: 85vh;
            overflow: hidden;
            animation: popIn 0.5s ease;
        }

        .products-section { padding: 40px; overflow-y: auto; }
        .header h1 { font-size: 3rem; color: var(--uwu-pink); margin: 0; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; margin-top: 20px; }

        .product-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 25px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s ease;
        }
        .product-card:hover { transform: translateY(-5px); background: var(--uwu-pink); color: white; }
        .product-card span { font-weight: 700; display: block; margin: 10px 0 5px; }

        .checkout-section { background: rgba(255, 255, 255, 0.4); padding: 40px; display: flex; flex-direction: column; border-left: 1px solid var(--glass-border); }
        .cart-title { font-size: 1.8rem; font-weight: 700; text-align: center; color: var(--uwu-pink); margin-bottom: 20px; }
        #cart-items { flex-grow: 1; overflow-y: auto; }

        .cart-item {
            display: flex; justify-content: space-between; align-items: center;
            background: white; margin-bottom: 8px; padding: 12px 15px; border-radius: 18px;
        }

        .remove-btn { background: #ffb3c6; border: none; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; color: white; }

        .totals { margin-top: 20px; padding: 25px; background: #fff; border-radius: 25px; text-align: center; }
        .total-row { display: flex; justify-content: space-between; font-size: 2rem; font-weight: 800; color: var(--uwu-pink); }

        .clear-btn {
            background: transparent; border: 2px solid #ffb3c6; color: #ffb3c6; padding: 8px 15px;
            border-radius: 12px; margin-top: 15px; cursor: pointer; font-weight: 700;
        }
        .clear-btn:hover { background: #ffb3c6; color: white; }

        #music-toggle {
            position: fixed; bottom: 20px; left: 20px; width: 45px; height: 45px;
            background: rgba(255, 255, 255, 0.6); border-radius: 50%; display: flex;
            justify-content: center; align-items: center; cursor: pointer; z-index: 100;
        }

        @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--uwu-pink); border-radius: 10px; }
    </style>
</head>
<body>

<div id="welcome-overlay">
    <button class="enter-btn" onclick="startCafe()">
        Entrar ฅ^•ﻌ•^ฅ
    </button>
</div>

<div class="bg-wrapper"></div>
<div id="sakura-container"></div>

<div id="music-toggle" style="display: none;" onclick="toggleMusic()">
    <span id="music-icon">⏸️</span>
</div>

<audio id="bg-audio" loop>
    <source src="https://r2.fivemanage.com/m10wOfsBbd2jLEbtALCU6/AnimalCrossing-BubblegumK.K.Remix(1).mp3" type="audio/mpeg">
</audio>

<div class="container">
    <section class="products-section">
        <div class="header">
            <h1>UwU Cafe</h1>
            <p style="text-align:center; opacity:0.7">Calculadora de Ventas ✨</p>
        </div>
        <div class="grid" id="product-grid"></div>
    </section>

    <section class="checkout-section">
        <div class="cart-title">Cuenta 🌸</div>
        <div id="cart-items"></div>
        <div class="totals">
            <div class="total-row">
                <span>Total:</span>
                <span id="total-amount">$0</span>
            </div>
            <button class="clear-btn" onclick="clearCart()">Limpiar Todo</button>
        </div>
    </section>
</div>

<script>
    const products = [
        { name: "RAMEN", price: 1500, emoji: "🍜" },
        { name: "SUSHI", price: 1500, emoji: "🍣" },
        { name: "DANGOS", price: 4500, emoji: "🍡" },
        { name: "DUMPLINGS", price: 1500, emoji: "🥟" },
        { name: "DORIYAKIS", price: 1500, emoji: "🥞" },
        { name: "ONIGIRIS", price: 1500, emoji: "🍙" },
        { name: "AWA DE UWU", price: 2000, emoji: "💧" },
        { name: "BUBBLE TEA", price: 1500, emoji: "🥤" },
        { name: "TE VERDE", price: 1500, emoji: "🍵" },
        { name: "SAKURA MILK", price: 2000, emoji: "🌸" },
        { name: "ICE COFFEE", price: 1500, emoji: "🧊" },
        { name: "MILKSHAKE FRESA", price: 2000, emoji: "🍓" }
    ];

    let cart = [];
    const audio = document.getElementById('bg-audio');

    function startCafe() {
        document.getElementById('welcome-overlay').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('welcome-overlay').style.display = 'none';
            document.getElementById('music-toggle').style.display = 'flex';
        }, 600);
        
        audio.volume = 0.02;
        audio.play();
        createSakuraInterval(); // Iniciar lluvia de flores
    }

    // Lógica de Sakura cayendo
    function createSakura() {
        const container = document.getElementById('sakura-container');
        const sakura = document.createElement('div');
        sakura.className = 'sakura';
        sakura.innerText = '🌸';
        
        const startPos = Math.random() * 100;
        const duration = Math.random() * 5 + 5; // Entre 5 y 10 segundos
        const size = Math.random() * 10 + 10; // Entre 10px y 20px
        
        sakura.style.left = startPos + 'vw';
        sakura.style.fontSize = size + 'px';
        sakura.style.animationDuration = duration + 's';
        sakura.style.opacity = Math.random();

        container.appendChild(sakura);

        setTimeout(() => {
            sakura.remove();
        }, duration * 1000);
    }

    function createSakuraInterval() {
        setInterval(createSakura, 500); // Crea una flor cada medio segundo
    }

    function toggleMusic() {
        if (audio.paused) {
            audio.play();
            document.getElementById('music-icon').innerText = "⏸️";
        } else {
            audio.pause();
            document.getElementById('music-icon').innerText = "▶️";
        }
    }

    function init() {
        const grid = document.getElementById('product-grid');
        products.forEach(p => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `<div style="font-size: 2rem;">${p.emoji}</div><span>${p.name}</span><small>$${p.price.toLocaleString()}</small>`;
            card.onclick = () => askQuantity(p);
            grid.appendChild(card);
        });
    }

    function askQuantity(product) {
        let qty = prompt(`¿Cuántos "${product.name}"?`, "1");
        if (qty !== null && qty !== "" && !isNaN(qty) && parseInt(qty) > 0) {
            cart.push({ name: product.name, qty: parseInt(qty), totalPrice: product.price * parseInt(qty), id: Date.now() });
            renderCart();
        }
    }

    function clearCart() {
        if(confirm("¿Vaciar toda la cuenta?")) { cart = []; renderCart(); }
    }

    function removeFromCart(id) {
        cart = cart.filter(item => item.id !== id);
        renderCart();
    }

    function renderCart() {
        const cartContainer = document.getElementById('cart-items');
        const totalDisplay = document.getElementById('total-amount');
        cartContainer.innerHTML = '';
        let total = 0;
        cart.forEach(item => {
            total += item.totalPrice;
            const div = document.createElement('div');
            div.className = 'cart-item';
            div.innerHTML = `<div><b>${item.qty}x</b> ${item.name}<br><small>$${item.totalPrice.toLocaleString()}</small></div><button class="remove-btn" onclick="removeFromCart(${item.id})">&times;</button>`;
            cartContainer.appendChild(div);
        });
        totalDisplay.innerText = `$${total.toLocaleString()}`;
    }

    init();
</script>
</body>
</html>
